name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnastitches_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values so env validation (src/lib/env.schema.ts) passes during the build.
    # No real secrets: nothing in CI talks to Paystack, Resend or Vercel Blob.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dnastitches_ci
      AUTH_SECRET: ci-dummy-auth-secret-not-used-anywhere
      AUTH_RESEND_KEY: re_ci_dummy
      ADMIN_EMAILS: admin@example.com
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_dummy
      PAYSTACK_SECRET_KEY: sk_test_ci_dummy
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_ci_dummy
      DEPOSIT_PERCENT: "50"
      REPAIR_WINDOW_DAYS: "7"
      RESEND_API_KEY: re_ci_dummy
      EMAIL_FROM: DNA Stitches <ci@example.com>
      CRON_SECRET: ci-dummy-cron-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STUDIO_TIMEZONE: Africa/Lagos
      DEFAULT_CURRENCY: NGN
      MIN_LEAD_TIME_DAYS: "14"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (also runs prisma generate)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma validate
        run: pnpm db:validate

      - name: Apply migrations and seed (forward-only, NFR-5)
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Unit & component tests
        run: pnpm test --coverage

      - name: Integration tests (Server Actions and data layer against Postgres)
        run: pnpm test:integration

      - name: Build
        run: pnpm build
